[build]
builder = "nixpacks"
# migrate deploy, et non db push : les migrations sont versionnees dans
# prisma/migrations. db push --accept-data-loss supprimerait sans
# confirmation toute colonne absente du schema.
buildCommand = "cd backend && npm install --include=dev && npm run build && node prisma/baseline.js && npx prisma migrate deploy"

[deploy]
# Le seed n'est volontairement plus lance au demarrage : il contient des
# comptes de demonstration, et le rejouer a chaque redemarrage n'a pas de
# sens en production. Lancer `npm run db:seed` manuellement si besoin.
startCommand = "cd backend && node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
