[build]
builder = "nixpacks"
buildCommand = "cd backend && npm ci && npm run build && npx prisma generate"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && npx prisma db seed && npm --prefix backend start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
