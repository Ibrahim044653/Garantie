[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && npx prisma migrate resolve --rolled-back 20260819000000_postgresql_init 2>/dev/null || true && npx prisma db push --accept-data-loss && node dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
